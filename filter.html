<!DOCTYPE html>
<html ng-app="myapp">
    <head > 
        <title>filters and table usage</title>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    </head>
    <body>
        <div ng-controller="mycontroller">
            <input type="text" ng-model="search" placeholder="enter the name">
            <br>
            <table>
                <tr>
                    <th>Name</th>
                    <th>department</th>
                </tr>
                <tr ng-repeat="student in students| filter:search">
                   <td>{{student.name}}</td> 
                   <td>{{student.department}}</td> 
                </tr>
            </table>
        </div>
        <script>
            var app = angular.module("myapp",[]);
            app.controller("mycontroller",function($scope){
                  $scope.search = "";
                  $scope.students = [
                {name: "Arun", department: "IT"},
                {name: "Bala", department: "CSE"},
                {name: "Anu", department: "IT"},
                {name: "Priya", department: "ECE"}
            ];

            });
        </script>
    </body>
</html>
